<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title or "Healthcare Jobs - CareVerse HQ" }}</title>
    <meta name="description" content="Browse published healthcare roles and apply through the public jobs board." />
    <link rel="icon" type="image/svg+xml" href="/assets/careverse_hq/images/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/careverse_hq/jobs-board/style.css?v={{ public_jobs_asset_version or '1' }}" />
  </head>
  <body>
    <div id="public-jobs-root"></div>

    <script>
      window.csrf_token = {{ (csrf_token or frappe.session.csrf_token) | tojson }};
      window.PUBLIC_JOBS_BOOT = {
        appName: {{ (app_name or "CareVerse HQ") | tojson }},
        logo: {{ logo | tojson }},
        currentYear: {{ (current_year or 2026) | tojson }},
        csrfToken: {{ (csrf_token or frappe.session.csrf_token) | tojson }},
        isAuthenticated: {{ 1 if is_authenticated else 0 }},
        hasAdminAccess: {{ 1 if has_admin_access else 0 }},
        userFullName: {{ (user_full_name or "") | tojson }},
        userInitials: {{ (user_initials or "") | tojson }},
        userEmail: {{ (user_email or "") | tojson }},
        userRoleLabel: {{ (user_role_label or "") | tojson }},
        adminCentralLink: {{ (admin_central_link or "/admin-central") | tojson }},
        profileLink: {{ (profile_link or "/admin-central#profile") | tojson }},
        signInLink: {{ (header_sign_in_link or "/login?redirect-to=/jobs") | tojson }},
        currentPath: {{ (current_path or "/jobs") | tojson }},
        jobSlug: {{ (job_slug or "") | tojson }},
      };
    </script>
    <script type="module" src="/assets/careverse_hq/jobs-board/public-jobs.js?v={{ public_jobs_asset_version or '1' }}"></script>
  </body>
</html>
