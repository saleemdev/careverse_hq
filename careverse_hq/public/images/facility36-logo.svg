<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 286 88" role="img" aria-labelledby="title desc">
  <title id="title">facility36 logo</title>
  <desc id="desc">facility36 wordmark with navy facility text, cyan 36 numerals, and circular network emblem.</desc>

  <defs>
    <style>
      .wordmark {
        font-family: "Avenir Next", "Montserrat", "Segoe UI", Arial, sans-serif;
        font-weight: 700;
        font-size: 44px;
        letter-spacing: -1.8px;
      }
      .navy { fill: #14347d; }
      .cyan { fill: #26c4ee; }
      .icon-stroke {
        fill: none;
        stroke: #ffffff;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <g transform="translate(0 2)">
    <text class="wordmark navy" x="24" y="56">facility</text>
    <text class="wordmark cyan" x="158" y="56">36</text>

    <g transform="translate(232 38)">
      <circle cx="0" cy="0" r="16.5" fill="#14347d"/>
      <circle cx="0" cy="0" r="11.5" class="icon-stroke" stroke-width="1.6" opacity="0.92"/>

      <path
        d="M -3.8 -5.2
           L 3.2 -7.8
           L 7.1 -1.2
           L 2.4 5.5
           L -5.1 3.7
           L -7.2 -2.0
           Z"
        class="icon-stroke"
        stroke-width="1.55"
      />

      <path
        d="M -3.8 -5.2
           C -1.6 -2.4, -0.8 0.2, -1.3 3.1
           M 3.2 -7.8
           C 1.7 -4.8, 1.5 -1.4, 2.4 1.8
           M -5.1 3.7
           C -2.2 2.4, 0.2 2.8, 2.4 5.5"
        class="icon-stroke"
        stroke-width="1.25"
        opacity="0.92"
      />

      <circle cx="-3.8" cy="-5.2" r="1.5" fill="#26c4ee"/>
      <circle cx="3.2" cy="-7.8" r="1.5" fill="#26c4ee"/>
      <circle cx="7.1" cy="-1.2" r="1.5" fill="#26c4ee"/>
      <circle cx="2.4" cy="5.5" r="1.5" fill="#26c4ee"/>
      <circle cx="-5.1" cy="3.7" r="1.5" fill="#26c4ee"/>
      <circle cx="-7.2" cy="-2.0" r="1.5" fill="#26c4ee"/>
    </g>
  </g>
</svg>
